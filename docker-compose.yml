version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: safeplace_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-safeplace_db}
      POSTGRES_USER: ${DB_USER:-safeplace_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-safeplace_password_123}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-safeplace_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - safeplace_network

  redis:
    image: redis:7-alpine
    container_name: safeplace_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-redis_password_123}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --tcp-backlog 511
      --tcp-keepalive 60
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password_123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - safeplace_network

  web:
    build: .
    container_name: safeplace_web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn
               --bind 0.0.0.0:8000
               --workers ${WEB_CONCURRENCY:-4}
               --threads ${WEB_THREADS:-2}
               --worker-class gthread
               --timeout 120
               --max-requests 1000
               --max-requests-jitter 100
               --keep-alive 5
               --access-logfile -
               --error-logfile -
               Safeplace.wsgi:application"
    environment:
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}

      # Base de données
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-safeplace_db}
      DB_USER: ${DB_USER:-safeplace_user}
      DB_PASSWORD: ${DB_PASSWORD:-safeplace_password_123}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: 5432

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password_123}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis_password_123}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis_password_123}@redis:6379/0
      CACHE_REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password_123}@redis:6379/1

      # Email
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}

      # Gunicorn scaling
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      WEB_THREADS: ${WEB_THREADS:-2}

    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - safeplace_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  celery:
    build: .
    container_name: safeplace_celery
    restart: unless-stopped
    command: celery -A Safeplace worker -l info --concurrency=${CELERY_WORKERS:-4} --max-tasks-per-child=500
    environment:
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-safeplace_db}
      DB_USER: ${DB_USER:-safeplace_user}
      DB_PASSWORD: ${DB_PASSWORD:-safeplace_password_123}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis_password_123}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis_password_123}@redis:6379/0
      CACHE_REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password_123}@redis:6379/1
    depends_on:
      - db
      - redis
      - web
    networks:
      - safeplace_network

  celery_beat:
    build: .
    container_name: safeplace_celery_beat
    restart: unless-stopped
    command: celery -A Safeplace beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-safeplace_db}
      DB_USER: ${DB_USER:-safeplace_user}
      DB_PASSWORD: ${DB_PASSWORD:-safeplace_password_123}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis_password_123}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis_password_123}@redis:6379/0
    depends_on:
      - db
      - redis
      - web
    networks:
      - safeplace_network

  nginx:
    image: nginx:alpine
    container_name: safeplace_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    networks:
      - safeplace_network

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

networks:
  safeplace_network:
    driver: bridge
